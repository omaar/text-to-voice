[project]
requires-python = ">=3.11"
dependencies = [
]

[tool.poetry]
name = "text-to-voice"
version = "0.1.0"
description = "API para convertir texto a voz"
authors = [
    "Omar Regino <omarjrz21@gmail.com>"
]
readme = "README.md"
packages = [{include = "text_to_voice", from = "src"}]


[tool.poetry.dependencies]
python = ">=3.8.1,<4.0"
fastapi = "^0.109.0"
uvicorn = "^0.27.0"
pyttsx3 = "^2.90"
PyPDF2 = "^3.0.1"
python-multipart = "^0.0.6"
pydantic = "^2.6.0"
pydantic-settings = "^2.1.0"


[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^24.1.0"
isort = "^5.13.0"
flake8 = "^7.0.0"


[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
